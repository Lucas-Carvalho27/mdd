<h5>Lixeira</h5>
<p class="resumo">Como recuperar escolas, turmas ou estudantes excluídos.</p>

<template data-perfis="rondonia-primeiros-passos">
  <section class="secao" id="lixeira-01">
    <p>Caso seja necessário recuperar dados excluídos, basta marcar o ícone <span class="ui">lixeira</span> e buscar a escola, turma ou estudante a ser recuperado, que estará em itálico.</p>
    <img src="img/lixeira/lixeira-01.png" alt="Lixeira">
  </section>
</template>

<template data-perfis="rondonia-primeiros-passos">
  <section class="secao" id="lixeira-02">
    <p>Para recuperar, clique no ícone <span class="ui">pincel</span>, localizado na mesma linha do registro. Logo após, basta clicar em <span class="ui">recuperar</span>. É possível recuperar toda uma escola, turma ou apenas um estudante.</p>
    <img src="img/lixeira/lixeira-02.png" alt="Lixeira">
  </section>
</template>

<template data-perfis="completa sem-resultados-detalhados">
  <section class="secao" id="lixeira-03">
    <h6>Recuperar dados excluídos</h6>
    <p>Agora é possível recuperar dados deletados, habilitando a caixa <span class="ui">lixeira</span> na parte superior da tela. Para recuperar, basta encontrar o dado, clicar no pincel e logo após em <span class="ui">recuperar</span>.</p>
    <img src="img/lixeira/lixeira-03.png" alt="Recuperar dados excluídos">
  </section>
</template>
