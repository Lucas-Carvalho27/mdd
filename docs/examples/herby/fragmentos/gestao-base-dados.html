<h4>Gestão da Base de Dados</h4>
<p class="resumo">Gestão dos dados de matrícula: compartilhar o acesso e adicionar, editar ou excluir escolas, turmas e estudantes.</p>

<template data-perfis="completa rondonia-primeiros-passos sem-resultados-detalhados">
  <section class="secao" id="gestao-base-dados-01">
    <h5>Visão geral</h5>
    <p>Nesta seção, você pode fazer a gestão dos dados de matrícula: incluir, editar ou excluir dados de escolas, turmas e estudantes. Também é possível compartilhar o acesso exclusivo para regionais, municípios, escolas ou turmas.</p>
    <img src="img/gestao-base-dados/gestao-base-dados-01.png" alt="Visão geral">
  </section>
</template>

<template data-perfis="completa rondonia-primeiros-passos sem-resultados-detalhados">
  <section class="secao" id="gestao-base-dados-02">
    <h5>Compartilhar o acesso</h5>
    <p>Clique no ícone <span class="ui">Copiar</span> e uma mensagem de boas-vindas, com o link de acesso, será copiada para sua área de transferência. Cole no WhatsApp, e-mail e compartilhe o acesso com os agentes que desejar, desde um município inteiro até somente uma turma específica.</p>
    <img src="img/gestao-base-dados/gestao-base-dados-02.png" alt="Compartilhar o acesso">
  </section>
</template>

<template data-perfis="rondonia-primeiros-passos">
  <aside class="aviso importante" id="gestao-base-dados-03">
    <p>Este agente terá acesso somente aos dados da unidade que você compartilhar.</p>
    <img src="img/gestao-base-dados/gestao-base-dados-03.png" alt="Gestão da Base de Dados">
    <img src="img/gestao-base-dados/gestao-base-dados-04.png" alt="Gestão da Base de Dados">
  </aside>
</template>

<template data-perfis="completa rondonia-primeiros-passos sem-resultados-detalhados">
  <section class="secao" id="gestao-base-dados-04">
    <h5>Adicionando dados</h5>
    <p>Para adicionar escolas, turmas ou estudantes,  clique no ícone <span class="ui">Mais</span>, localizado na mesma linha do registro onde você pretende incluir os dados. Para finalizar, clique em <span class="ui">Enter</span> ou em <span class="ui">Mais</span>.</p>
    <img src="img/gestao-base-dados/gestao-base-dados-05.png" alt="Adicionando dados">
  </section>
</template>

<template data-perfis="completa rondonia-primeiros-passos sem-resultados-detalhados">
  <section class="secao" id="gestao-base-dados-05">
    <h5>Editando dados</h5>
    <p>Para editar dados de escolas, turmas ou estudantes, clique no ícone <span class="ui">Pincel</span>, localizado na mesma linha do registro que deseja alterar. Registre a informação correta e clique em <span class="ui">Salvar</span>.</p>
    <img src="img/gestao-base-dados/gestao-base-dados-06.png" alt="Editando dados">
  </section>
</template>

<template data-perfis="completa rondonia-primeiros-passos sem-resultados-detalhados">
  <section class="secao" id="gestao-base-dados-06">
    <h5>Excluindo dados</h5>
    <p>Para deletar escolas, turmas ou estudantes,  clique no ícone <span class="ui">pincel</span>, localizado na mesma linha do registro que deseja excluir. Depois, clique em <span class="ui">excluir</span> e confirme sua ação.  É importante lembrar que caso haja avaliações já realizadas, os resultados referentes a elas também serão deletados.</p>
    <img src="img/gestao-base-dados/gestao-base-dados-07.png" alt="Excluindo dados">
  </section>
</template>
